ui:
  portrait_asset: "/personas/miyamoto_musashi.webp"   # served from apps/web/public/personas/
  accent_color: "#26241F"                            # sumi-ink near-black (FIGURE accent; background stays light)
  short_tagline_el: "Για την τομή που όλο αναβάλλεις."
  short_tagline_en: "For the cut you keep not making."
  warning_label_el: "Δεν θα καθησυχάσει τον δισταγμό σου. Θα σου ζητήσει να επιλέξεις ή να αποσυρθείς τίμια."
  warning_label_en: "He will not soothe your hesitation. He will ask you to choose, or step back."

# ─────────────────────────────────────────────────────────────
# ABOUT COPY (app-voice, B5 persona detail) — 6-sentence format
# (v0.9.1: softened "undefeated sixty duels", reduced coaching abstraction,
#  perception/timing/training/action language)
# ─────────────────────────────────────────────────────────────

about_en: |
  Miyamoto Musashi (c.1584–1645) was a Japanese swordsman, strategist, artist,
  and writer, remembered for a legendary record of duels and for reducing
  strategy to severe practical principles near the end of his life. His concern
  is not comfort, explanation, or self-display. It is clear perception,
  disciplined training, timing, and action without waste. He is spare, grave,
  and unsentimental; he cuts away the surplus until only the next necessary
  move remains. He is not a warrior cheerleader — his force is stillness, not
  noise. Bring him the decision you keep postponing, the craft you have stopped
  training, or the fear that is making you misread the field. He is best for
  hesitation, discipline, timing, restraint, and the hard practice of doing one
  thing cleanly.


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your verification code</title>
</head>
<body style="margin: 0; padding: 40px 20px; background-color: #FAF4E6; font-family: Georgia, 'Times New Roman', serif;">
  <div style="max-width: 480px; margin: 0 auto; background-color: #FFFFFF; padding: 40px 32px; border-radius: 4px;">

    <!-- Header motif — armchair-with-W, centered. Table layout for Outlook (C2).
         Its OWN cell: the code below never sits over this image, so a failed or
         un-faded image (Outlook ignores opacity) never affects legibility. -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin: 0 auto 20px auto;">
      <tr>
        <td align="center">
          <img src="{{ image_url }}" alt="The Wise Room" width="120" height="150"
               style="display: block; border: 0; opacity: 0.9;" />
        </td>
      </tr>
    </table>

    <h1 style="font-family: Georgia, serif; font-weight: 300; font-size: 28px; color: #1F1B14; margin: 0 0 24px 0; text-align: center; letter-spacing: 0.5px;">
      The Wise Room
    </h1>
    <p style="font-size: 14px; color: #5A5246; line-height: 1.6; margin: 0 0 20px 0; text-align: center;">
      Your verification code:
    </p>

    <!-- Code cell — solid background, on its own. Fully readable + copyable. -->
    <div style="background-color: #FAF4E6; padding: 24px; border-radius: 4px; text-align: center; margin: 0 0 24px 0;">
      <span style="font-family: 'Courier New', monospace; font-size: 32px; font-weight: 500; color: #1F1B14; letter-spacing: 8px;">
        {{ code }}
      </span>
    </div>

    <p style="font-size: 13px; color: #5A5246; line-height: 1.6; margin: 0 0 16px 0; text-align: center;">
      This code expires in 10 minutes.
    </p>
    <p style="font-size: 11px; color: #8A7E6A; line-height: 1.6; margin: 32px 0 0 0; text-align: center;">
      If you didn't request this, you can safely ignore this email.
    </p>
  </div>
</body>
</html>

name: Web build

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-build.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-build.yml'

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Measurement only. next.config.js sets typescript.ignoreBuildErrors and
      # eslint.ignoreDuringBuilds, so `npm run build` validates nothing — these two
      # steps report how much is currently broken. continue-on-error is deliberate:
      # a red X here must never block a merge until we decide to enforce.
      - name: Typecheck (report only)
        run: npm run typecheck
        continue-on-error: true

      - name: Tests (report only)
        run: npm test -- run
        continue-on-error: true

      - name: Build
        run: npm run build

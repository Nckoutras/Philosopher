name: UAT Day 3 public smoke

on:
  pull_request:
    paths:
      - 'apps/web/tests/uat-day3.smoke.spec.ts'
      - '.github/workflows/uat-day3-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright test runner without changing repository lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public smoke and explicitly skip unavailable auth
        run: npx playwright test tests/uat-day3.smoke.spec.ts --reporter=line --workers=1
        env:
          WISE_ROOM_UAT_BASE_URL: https://thewiseroom.app

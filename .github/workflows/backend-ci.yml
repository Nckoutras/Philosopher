name: Backend CI

# NO `paths:` FILTER, DELIBERATELY — every push to main and every PR runs this.
#
# There was one, narrowing to apps/api and this workflow's own files. It was
# removed on 2026-09-14, the day branch protection was added to `main`, because
# the two are incompatible in a way that only appears once protection exists.
#
# A required status check that never REPORTS does not resolve to "skipped". It
# sits at "Expected — waiting for status to be reported", and the merge button
# never opens. A docs-only or web-only PR triggers no backend run at all, so under
# protection it would be blocked forever with nothing red to point at and nothing
# to re-run. That is a worse failure than a slow CI: it looks like a bug in GitHub
# rather than a filter doing exactly what it was told.
#
# The cost of removing it is minutes on runs that cannot fail. This is a public
# repository, so Actions minutes are free, and the alternative fixes are all worse
# — path-aware dummy jobs that report success without testing anything, or a
# protection rule that lists no required checks.
#
# The other half of the 2026-09-01 lesson still stands and is now unreachable by
# accident: "no run" was indistinguishable from "passed" on a PR page. With no
# filter, every PR has runs to read.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Suite + alembic head count ──────────────────────────────────────────────
  # These share a job because both need the installed dependencies. No
  # continue-on-error anywhere in this file: unlike web-build.yml's report-only
  # steps, these are meant to block.
  tests:
    name: pytest (baseline) + alembic single head
    runs-on: ubuntu-latest
    env:
      # The conftest files already set these via os.environ.setdefault, but that
      # guard is load-bearing by accident. Setting them here means the suite does
      # not depend on it. Dummy values: nothing here authenticates anything.
      OPENAI_API_KEY: sk-test-dummy
      ANTHROPIC_API_KEY: test-dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Matches apps/api/Dockerfile (python:3.12-slim). CI must run the
          # version production runs.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Informational only — `continue-on-error: true` on the step, and nothing
      # here gates the build. It exists because a render assertion in the image-service
      # suite was platform-dependent and cost nine red runs (#11-#19) before the
      # cause was pinned down: the same U+2009 draws .notdef under basic layout and
      # blanks under HarfBuzz's space fallback, so a card test can pass locally and
      # fail here for reasons no log showed. Printing the imaging build turns that
      # inference into a fact on every run.
      - name: Environment report
        working-directory: apps/api
        continue-on-error: true
        run: |
          python - <<'PY'
          from PIL import features
          import PIL
          print("Pillow          :", PIL.__version__)
          print("raqm (harfbuzz) :", features.check("raqm"))
          print("freetype2       :", features.version("freetype2"))
          PY

      # Fails only on failures absent from apps/api/tests/ci_baseline_failures.txt.
      # The script runs pytest itself so it can be reproduced locally, verbatim.
      - name: pytest against committed baseline
        run: python .github/scripts/check_pytest_baseline.py

      # File-based: reads db/migrations/versions, never opens a connection.
      # Verified locally with DATABASE_URL scrubbed from the environment.
      - name: Alembic single head
        working-directory: apps/api
        run: |
          heads="$(python -m alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found $count"
            echo "Two heads means two migrations share a down_revision."
            echo "Resolve with a merge migration before merging this PR."
            exit 1
          fi
          echo "OK — exactly one alembic head."

  # ── Live-Postgres tests (TD-57 down payment) ────────────────────────────────
  # SEPARATE JOB, not a step in `tests`, so the Actions page says which kind of
  # failure happened: a mocked-suite regression and a schema regression are
  # different problems and should not share a red X.
  #
  # The image MUST carry pgvector: 001 runs CREATE EXTENSION vector and 008 builds
  # HNSW indexes, neither of which plain postgres:16 can do.
  db-tests:
    name: pytest (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: philosopher_test
        ports:
          - 5432:5432
        # Without the health check the suite races the container and fails on
        # connection refused rather than on anything real.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENAI_API_KEY: sk-test-dummy
      ANTHROPIC_API_KEY: test-dummy
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/philosopher_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Gates merges exactly like the `tests` job: no continue-on-error. A schema
      # regression must block, which is the whole reason this job exists.
      #
      # The fixture builds the schema by MIGRATION, in three stages — upgrade to
      # 048, insert the pre-049 quotes corpus, upgrade to head. `alembic upgrade
      # head` alone does not run on an empty database: 049_quotes_expand updates 88
      # quote rows and raises when an update matches no row, and no migration
      # inserts them. db/seed_quotes.py cannot be that stage either — its data file
      # has since grown to the current 198-row corpus, so it inserts 049's own rows
      # ahead of it. See tests/db_live/conftest.py.
      - name: pytest (live Postgres)
        working-directory: apps/api
        run: python -m pytest tests/db_live -v

  # ── C-04 migration naming ───────────────────────────────────────────────────
  # Standalone and dependency-free: stdlib only, no pip install, finishes in
  # seconds and reports independently of the suite.
  migration-naming:
    name: C-04 migration naming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check revision id length and filename match
        run: python .github/scripts/check_migration_naming.py
